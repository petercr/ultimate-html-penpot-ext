<!doctype html>
<meta charset="utf-8">
<title>Importer color and opacity fidelity fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #f8fafc; color: #182230; font: 16px/1.4 Arial, sans-serif; }
  .card {
    width: 320px;
    padding: 20px;
    background: rgb(30 90 150 / 40%);
    border: 4px solid #d946ef80;
    border-radius: 12px;
    box-shadow: 0 8px 18px rgb(15 23 42 / 28%);
  }
  .outer { margin-top: 20px; opacity: .5; }
  .inner { padding: 12px; background: #22c55e99; opacity: .5; }
  .decorated-text {
    display: inline-block;
    margin-top: 20px;
    padding: 4px 8px;
    color: #0f172a;
    background: rgb(251 191 36 / 35%);
    border: 2px solid rgb(14 116 144 / 55%);
    box-shadow: 0 2px 6px rgb(0 0 0 / 20%);
    opacity: .5;
    text-decoration: underline;
  }
  .transparent-text { display: block; margin-top: 20px; color: transparent; }
  .unsupported-color { margin-top: 20px; color: color(display-p3 0.95 0.2 0.35 / .8); }
  .unsupported-gradient { height: 32px; margin-top: 12px; background: linear-gradient(90deg, #2563eb, color(display-p3 0.95 0.2 0.35), #facc15); }
</style>
<main>
  <section class="card">Translucent fill, border, and shadow</section>
  <section class="outer"><div class="inner">Nested 50% opacity (.25 composited)</div></section>
  <span class="decorated-text">Decorated direct text at 50% opacity</span>
  <span class="transparent-text">This text must remain fully transparent</span>
  <span class="unsupported-color">CSS Color 4 diagnostic</span>
  <div class="unsupported-gradient" aria-label="CSS Color 4 gradient diagnostic"></div>
</main>
